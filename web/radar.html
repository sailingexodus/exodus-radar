<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Exodus Radar</title>
<style>
:root {
  --panel: #111; --panel2: #151c26; --line: #3a4a5c; --white: #ecf3fa; --grey: #8a9aab; --dim: #5a6a78;
  --blue: #4dc8ff; --green: #4dff4d; --amber: #ffcc44; --red: #ff5a52; --btn: #222; --btn-on: #444466;
  --mono: "DejaVu Sans Mono", Consolas, "Courier New", monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: #000; color: var(--white); font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
body { overflow: hidden; }
body.portrait { overflow-y: auto; }
#app { display: flex; flex-direction: row; width: 100vw; height: 100vh; }
body.portrait #app { flex-direction: column; height: auto; min-height: 100vh; }
#left { position: relative; flex: 0 0 auto; background: #000; }
canvas { display: block; }
#scope, #over { position: absolute; left: 0; top: 0; }
#over { touch-action: manipulation; }
#info { position: relative; flex: 1 1 auto; background: var(--panel); min-width: 0; overflow: hidden; padding: 6px 14px 64px; }
body.portrait #info { overflow: visible; padding-bottom: 80px; }
#info::before { content: ""; position: absolute; inset: 4% 3%; background: url("radar-logo.png") center / contain no-repeat; opacity: .12; pointer-events: none; }
#info > * { position: relative; }
.row { display: flex; align-items: baseline; gap: 14px; margin: 2px 0; font-family: var(--mono); font-weight: 700; }
.row .lab { color: var(--grey); font-size: clamp(16px, 1.7vw, 28px); width: 4.2em; flex: 0 0 auto; }
.row .val { font-size: clamp(26px, 3.2vw, 46px); }
.row .val.mid { font-size: clamp(20px, 2.4vw, 34px); }
.row .tag { color: var(--amber); font-size: clamp(12px, 1.2vw, 20px); font-weight: 400; }
.dim { color: #6e7882; }
.sep { border-top: 1px solid #223040; margin: 8px 0; }
#cursor { font-family: var(--mono); font-size: clamp(13px, 1.4vw, 22px); color: var(--blue); min-height: 1.4em; }
#cursor.idle { color: #5a6a78; }
.head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: clamp(18px, 1.8vw, 26px); }
.head .n { color: var(--grey); font-weight: 400; font-family: var(--mono); font-size: clamp(12px, 1.3vw, 20px); }
.ok { color: var(--green); } .bad { color: var(--red); } .amber { color: var(--amber); }
.dng { margin: 3px 0; }
.dng b { color: #ff786e; font-family: var(--mono); font-size: clamp(16px, 1.8vw, 27px); display: block; }
.dng span { font-family: var(--mono); font-size: clamp(12px, 1.3vw, 20px); }
:root { --rose: clamp(230px, 24vw, 470px); }
#ais { font-family: var(--mono); }
#ais .a { display: flex; gap: 14px; align-items: baseline; margin: 1px 0; font-size: clamp(13px, 1.45vw, 25px); white-space: nowrap; }
#ais .a b { color: #4dff4d; min-width: 8.5em; overflow: hidden; text-overflow: ellipsis; }
#ais .a span { color: #7fbf8f; }
#rosewrap { position: absolute; right: 14px; top: 8px; width: var(--rose); }
#normalview { min-height: calc(var(--rose) - 24px); }
#cursor { max-width: calc(100% - var(--rose) - 24px); }
body.portrait #normalview { min-height: 0; } body.portrait #cursor { max-width: none; }
body.portrait #rosewrap { position: relative; right: auto; top: auto; margin: 4px auto; }
#rose { width: 100%; height: auto; aspect-ratio: 1; }
#foot { position: absolute; left: 14px; bottom: 70px; font-size: 13px; color: #5a6a78; max-width: calc(100% - 520px); min-width: 200px; }
body.portrait #foot { position: relative; left: auto; bottom: auto; margin-top: 10px; }
#status { font-family: var(--mono); font-size: 12px; margin-top: 4px; }
/* anchor watch */
#aw { position: absolute; right: 14px; bottom: 66px; width: min(460px, calc(100% - 28px)); background: var(--panel2); border: 1px solid var(--line); padding: 8px; }
body.portrait #aw { position: relative; right: auto; bottom: auto; width: 100%; margin-top: 12px; }
#aw .r { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#aw button { border: 0; color: var(--white); font-weight: 700; font-size: 18px; padding: 8px 12px; background: #444466; min-width: 42px; }
#awbtn { background: #3a1a1a !important; min-width: 130px !important; }
#awbtn.on { background: #1a4d1a !important; }
#awrad { font-family: var(--mono); font-size: 20px; font-weight: 700; min-width: 5.5em; text-align: center; }
#awinfo { font-size: 13px; margin-top: 4px; }
/* bigger anchor-mode readouts */
#anchorview { display: none; }
body.armed #normalview { display: none; }
body.armed #anchorview { display: block; }
.big .lab { color: var(--grey); font-weight: 700; font-size: clamp(16px, 1.7vw, 26px); }
.big .num { font-family: var(--mono); font-weight: 700; font-size: clamp(54px, 9vw, 150px); line-height: 1.02; }
/* top bar and drawer */
#topbar { position: absolute; left: 8px; top: 6px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 5; max-width: calc(100% - 16px); }
#topbar button, #topbar select { background: var(--btn); color: var(--white); border: 1px solid var(--line); font-size: clamp(14px, 1.5vw, 18px); font-weight: 700; padding: 7px 10px; border-radius: 3px; }
#btn-north { background: #4d4d1a !important; } #btn-north.n { background: var(--btn-on) !important; }
#btn-power.p0 { background: #3a4a5c; } #btn-power.p1 { background: #5a4d00; } #btn-power.p2 { background: #5a1a1a; } #btn-power.warn { color: var(--amber); }
#ctl { position: absolute; right: 0; top: 0; width: min(330px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); z-index: 6; display: none; padding: 8px 10px 14px; }
#ctl.open { display: block; }
#ctl h3 { margin: 4px 0 6px; font-size: 20px; color: var(--blue); display: flex; justify-content: space-between; align-items: baseline; }
#ctl h3 small { font-size: 12px; font-weight: 400; color: var(--grey); }
#ctl .blk { margin: 10px 0 0; }
#ctl .blk .t { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 15px; }
#ctl input[type=range] { width: 100%; height: 34px; }
#ctl button, #ctl select { background: var(--btn); color: var(--white); border: 1px solid var(--line); font-weight: 700; padding: 8px 10px; font-size: 14px; border-radius: 3px; }
#ctl button.on { background: #1a4d1a; } #ctl button.sel { background: var(--btn-on); }
#pwr { display: flex; gap: 5px; } #pwr button { flex: 1; padding: 12px 4px; }
#pwr button.p2.on { background: #5a1a1a; } #pwr button.p1.on { background: #5a4d00; } #pwr button.p0.on { background: #3a4a5c; }
#rangegrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
#ctl a { display: block; text-align: center; background: var(--btn-on); color: #fff; text-decoration: none; padding: 10px; margin-top: 14px; font-weight: 700; border-radius: 3px; }
#rudder { position: fixed; left: 0; right: 0; bottom: 0; height: 52px; width: 100%; z-index: 4; background: #111; }
body.portrait #rudder { position: fixed; }
body.view .ctlonly { display: none !important; }
@media (max-height: 820px) { #ais .a:nth-child(n+4) { display: none; } }   /* short screens: keep the list clear of the footer */
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <canvas id="scope"></canvas>
    <canvas id="over"></canvas>
    <div id="topbar">
      <select id="rngsel" class="ctlonly" title="Range"></select>
      <button id="btn-north">HEAD UP</button>
      <button id="btn-power" class="ctlonly">POWER</button>
      <button id="btn-more" class="ctlonly">MORE</button>
    </div>
    <div id="ctl"></div>
  </div>
  <div id="info">
    <div id="rosewrap"><canvas id="rose" width="660" height="660"></canvas></div>
    <div id="normalview">
      <div class="row"><span class="lab">HDG</span><span class="val" id="v-hdg">---</span></div>
      <div class="row"><span class="lab">SOG</span><span class="val" id="v-sog">---</span></div>
      <div class="row"><span class="lab">STW</span><span class="val" id="v-stw">no feed</span></div>
      <div class="row"><span class="lab">CUR</span><span class="val mid" id="v-cur">no feed</span></div>
      <div class="row"><span class="lab">DEPTH</span><span class="val" id="v-depth">---</span></div>
      <div class="row"><span class="lab">POS</span><span class="val mid" id="v-pos">---</span></div>
      <div class="sep"></div>
      <div id="cursor" class="idle">CURSOR  click the scope to measure</div>
    </div>
    <div id="anchorview" class="big">
      <div class="lab">DEPTH (ft)</div><div class="num" id="a-depth">---</div>
      <div class="lab">SOG (kn)</div><div class="num" id="a-sog">---</div>
      <div class="lab">CURRENT</div><div class="num" style="font-size:clamp(30px,4vw,64px);color:#4fc3f7" id="a-cur">no feed</div>
    </div>
    <div class="sep"></div>
    <div class="head"><span id="dng-h" class="ok">DANGEROUS AIS</span><span class="n" id="dng-n">0 tracked</span></div>
    <div id="dng"></div>
    <div class="head" style="margin-top:10px"><span class="ok" id="ais-h">AIS AROUND US</span><span class="n" id="ais-n"></span></div>
    <div id="ais"></div>
    <div id="foot">A second opinion, not the ship's radar. Navigate on your chartplotter.<div id="status"></div></div>
    <div id="aw" class="ctlonly">
      <div class="r"><button id="awbtn">WATCH OFF</button>
        <span class="r"><button id="aw-m">&minus;</button><span id="awrad">150 ft</span><button id="aw-p">+</button></span></div>
      <div id="awinfo"></div>
    </div>
  </div>
</div>
<canvas id="rudder"></canvas>

<script>
"use strict";
// ======================================================================= setup
const Q = new URLSearchParams(location.search);
const VIEW = Q.get("view") === "1";
const HOST = location.hostname || "localhost";
const API = location.origin;                      // this page is served by radar-web-api.py, which also carries the radar controls and the anchor watch
const SK = "http://" + HOST + ":3000/signalk/v1/api/";   // Signal K, for heading, wind, depth, position and AIS
const NM = 1852, FT = 3.28084, KN = 1.9438452;
const DANGER_CPA_FT = 1000, DANGER_TCPA_S = 15 * 60, AIS_MAX_AGE = 900;
const $ = id => document.getElementById(id);
if (VIEW) document.body.classList.add("view");

let cfg = { northup: false, trails: true, ais: true, gain: 12 };
try { Object.assign(cfg, JSON.parse(localStorage.getItem("exodusRadar") || "{}")); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem("exodusRadar", JSON.stringify(cfg)); } catch (e) {} };

const nav = { hdg: null, cog: null, sog: null, pos: null, wind: null, wangle: null, tangle: null, depth: null, rudder: null, stw: null };
const ais = { targets: [], self: null };
const rc = { id: Q.get("id") || null, name: "", caps: null, vals: {}, ok: false, err: "", errT: 0, nspokes: 250, built: false };
const radar = { nc: 173, naz: 250, polar: null, last: 0, pps: 0, count: 0, c0: 0, hdgRadar: null, rangeM: 463 };
const aw = { cfg: {}, st: {}, now: 0 };
let swell = null, nearFt = 650, cursor = null;
let txConfirm = 0;
const iso = ts => { if (!ts) return null; const t = Date.parse(ts); return isFinite(t) ? (Date.now() - t) / 1000 : null; };
const ageText = s => s < 90 ? Math.round(s) + " s" : s < 5400 ? Math.round(s / 60) + " min" : Math.round(s / 3600) + " h";
const fresh = ts => { const a = iso(ts); return a === null || a <= 120; };

// ======================================================================= layout
const left = $("left"), scopeC = $("scope"), overC = $("over");
let S = 600, DPR = 1, k = 1;
function layout() {
  const w = innerWidth, h = innerHeight;
  const portrait = w < h * 1.1;
  document.body.classList.toggle("portrait", portrait);
  S = portrait ? Math.min(w, h * 0.78) : Math.min(h - 56, w * 0.64);
  S = Math.floor(S);
  DPR = Math.min(devicePixelRatio || 1, 2);
  left.style.width = S + "px"; left.style.height = S + "px";
  for (const c of [scopeC, overC]) { c.style.width = S + "px"; c.style.height = S + "px"; c.width = Math.round(S * DPR); c.height = Math.round(S * DPR); }
  k = S * DPR / 980;
  const rd = $("rudder"); rd.style.height = "52px"; rd.width = Math.round(w * DPR); rd.height = Math.round(52 * DPR);
}
addEventListener("resize", layout);
layout();

// ======================================================================= palette (mayara's own 128-level legend)
const DEFAULT_LEGEND = [[0,0,0,0],[8,0,0,48],[16,0,0,97],[24,0,0,145],[32,0,0,194],[40,0,0,242],[48,0,36,218],[56,0,85,170],[64,0,133,121],[72,0,182,72],[80,0,230,24],[88,24,236,0],[96,72,188,0],[104,121,139,0],[112,170,91,0],[120,218,42,0],[127,238,18,0]];
let PAL = new Uint32Array(128);
function defaultPalette() {
  for (let i = 0; i < 128; i++) {
    let j = 0; while (j < DEFAULT_LEGEND.length - 2 && DEFAULT_LEGEND[j + 1][0] < i) j++;
    const a = DEFAULT_LEGEND[j], b = DEFAULT_LEGEND[j + 1], t = (i - a[0]) / (b[0] - a[0]);
    const c = [1, 2, 3].map(n => Math.round(a[n] + (b[n] - a[n]) * Math.min(1, Math.max(0, t))));
    PAL[i] = (255 << 24) | (c[2] << 16) | (c[1] << 8) | c[0];
  }
}
defaultPalette();
function setPalette(legend) {
  try {
    const px = legend.pixels, n = Math.min(128, px.length);
    if (n < 16) return;
    const p = new Uint32Array(128);
    for (let i = 0; i < 128; i++) {
      const h = px[Math.min(n - 1, i)].color.replace("#", "");
      p[i] = (255 << 24) | (parseInt(h.slice(4, 6), 16) << 16) | (parseInt(h.slice(2, 4), 16) << 8) | parseInt(h.slice(0, 2), 16);
    }
    PAL = p;
  } catch (e) {}
}

// ======================================================================= radar spokes (mayara WebSocket, protobuf)
let ws = null;
function connectSpokes() {
  if (!rc.id) return;
  try { if (ws) ws.close(); } catch (e) {}
  ws = new WebSocket("ws://" + HOST + ":6502/signalk/v2/api/vessels/self/radars/" + rc.id + "/spokes");
  ws.binaryType = "arraybuffer";
  ws.onmessage = e => onSpokes(new Uint8Array(e.data));
  ws.onclose = () => setTimeout(connectSpokes, 2000);
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}
let pb = 0;
function vi(b) { let r = 0, m = 1, x; do { x = b[pb++]; r += (x & 127) * m; m *= 128; } while (x & 128); return r; }
function onSpokes(b) {
  pb = 0;
  while (pb < b.length) {
    const tag = vi(b), f = tag >>> 3, w = tag & 7;
    if (w === 2) {
      const len = vi(b), end = pb + len;
      if (f === 2) parseSpoke(b, end);
      pb = end;
    } else if (w === 0) vi(b); else if (w === 1) pb += 8; else if (w === 5) pb += 4; else break;
  }
}
function parseSpoke(b, end) {
  let angle = 0, bearing = 0, range = 0, data = null;
  while (pb < end) {
    const tag = vi(b), f = tag >>> 3, w = tag & 7;
    if (w === 0) { const v = vi(b); if (f === 1) angle = v; else if (f === 2) bearing = v; else if (f === 3) range = v; }
    else if (w === 2) { const n = vi(b); if (f === 5) data = b.subarray(pb, pb + n); pb += n; }
    else if (w === 1) pb += 8; else if (w === 5) pb += 4; else { pb = end; return; }
  }
  if (!data) return;
  const nc = data.length, naz = rc.nspokes;
  if (!radar.polar || radar.nc !== nc || radar.naz !== naz) { radar.nc = nc; radar.naz = naz; radar.polar = new Float32Array(naz * nc); lutKey = ""; }
  if (angle >= naz) return;
  const base = angle * nc, P = radar.polar;
  for (let i = 0; i < nc; i++) P[base + i] = data[i];
  radar.last = Date.now(); radar.count++;
  radar.hdgRadar = ((bearing - angle) / naz * 360 + 720) % 360;
}

// ======================================================================= rendering the picture
const off = document.createElement("canvas");
let R = 640, lutKey = "", LUT = null, img = null, img32 = null, offctx = null, slow = 0;
function buildLUT() {
  const naz = radar.naz, nc = radar.nc;
  lutKey = [R, naz, nc].join("/");
  off.width = off.height = R; offctx = off.getContext("2d");
  img = offctx.createImageData(R, R); img32 = new Uint32Array(img.data.buffer);
  const half = R / 2, idx = [];
  for (let y = 0; y < R; y++) for (let x = 0; x < R; x++) {
    const dx = x + 0.5 - half, dy = y + 0.5 - half;
    if (dx * dx + dy * dy <= half * half) idx.push(y * R + x);
  }
  const n = idx.length;
  LUT = { n, px: Int32Array.from(idx), i00: new Int32Array(n), i01: new Int32Array(n), i10: new Int32Array(n), i11: new Int32Array(n),
          fa: new Float32Array(n), fc: new Float32Array(n) };
  for (let j = 0; j < n; j++) {
    const p = idx[j], y = (p / R) | 0, x = p - y * R;
    const dx = x + 0.5 - half, dy = y + 0.5 - half;
    let ang = Math.atan2(dx, -dy); if (ang < 0) ang += 2 * Math.PI;
    const r = Math.hypot(dx, dy) / half;
    const azf = ang / (2 * Math.PI) * naz - 0.5, a0f = Math.floor(azf);
    const a0 = ((a0f % naz) + naz) % naz, a1 = (a0 + 1) % naz;
    const cf = r * nc - 0.5, c0 = Math.min(nc - 1, Math.max(0, Math.floor(cf))), c1 = Math.min(nc - 1, c0 + 1);
    LUT.fa[j] = azf - a0f; LUT.fc[j] = Math.min(1, Math.max(0, cf - c0));
    LUT.i00[j] = a0 * nc + c0; LUT.i01[j] = a0 * nc + c1; LUT.i10[j] = a1 * nc + c0; LUT.i11[j] = a1 * nc + c1;
  }
}
function renderPicture() {
  if (!radar.polar) return;
  if (lutKey !== [R, radar.naz, radar.nc].join("/")) buildLUT();
  const P = radar.polar, L = LUT, n = L.n, thr = cfg.gain;
  const dec = cfg.trails ? 0.97 : 0.80;
  img32.fill(0xFF000000);
  for (let j = 0; j < n; j++) {
    const fa = L.fa[j], fc = L.fc[j];
    const v0 = P[L.i00[j]] * (1 - fc) + P[L.i01[j]] * fc, v1 = P[L.i10[j]] * (1 - fc) + P[L.i11[j]] * fc;
    const v = v0 * (1 - fa) + v1 * fa;
    if (v > thr) img32[L.px[j]] = PAL[v > 126 ? 127 : (v | 0)];
  }
  for (let i = 0, m = P.length; i < m; i++) P[i] *= dec;
  offctx.putImageData(img, 0, 0);
}

const sctx = scopeC.getContext("2d"), octx = overC.getContext("2d");
const C = 490, RAD = 428;
function hdgRad() { return nav.hdg !== null ? nav.hdg : (radar.hdgRadar !== null && Date.now() - radar.last < 3000 ? radar.hdgRadar * Math.PI / 180 : null); }
function rangeNm() { const rv = rc.vals.range && rc.vals.range.value; return rv ? rv / NM : radar.rangeM / NM; }
function drawScope() {
  const t0 = performance.now();
  renderPicture();
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.fillStyle = "#000"; sctx.fillRect(0, 0, scopeC.width, scopeC.height);
  if (radar.polar) {
    const h = hdgRad();
    sctx.save();
    sctx.translate(C * k, C * k);
    if (cfg.northup && h !== null) sctx.rotate(h);
    sctx.imageSmoothingEnabled = true; sctx.imageSmoothingQuality = "high";
    sctx.drawImage(off, -RAD * k, -RAD * k, 2 * RAD * k, 2 * RAD * k);
    sctx.restore();
  }
  drawOverlay();
  const dt = performance.now() - t0;                    // slow device (TV stick)? render the picture smaller
  slow = dt > 110 ? slow + 1 : Math.max(0, slow - 1);
  if (slow > 12 && R > 400) { R = Math.max(400, Math.round(R * 0.8)); slow = 0; }
}

// ======================================================================= overlay: rings, scale, AIS, anchor, swell, cursor
function toXY(dx, dy, h) {
  let brg = Math.atan2(dx, dy);
  if (!cfg.northup) { if (h === null) return null; brg -= h; }
  const r = Math.hypot(dx, dy) / (rangeNm() * NM) * RAD;
  return [C + r * Math.sin(brg), C - r * Math.cos(brg), r];
}
function fmtRng(nm) { return nm >= 0.25 ? (Math.round(nm * 1000) / 1000) + " nm" : (Math.round(nm * 6076.12 / 10) * 10) + " ft"; }
function fmtDist(m) { const ft = m * FT; return ft < 1000 ? (Math.round(ft / 10) * 10) + " ft" : (m / NM).toFixed(2) + " nm"; }
function tri(c, x, y, s, a, col) {
  c.beginPath();
  c.moveTo(x + Math.cos(a - Math.PI / 2) * s * 1.6, y + Math.sin(a - Math.PI / 2) * s * 1.6);
  c.lineTo(x + Math.cos(a + Math.PI / 2 + 0.55) * s, y + Math.sin(a + Math.PI / 2 + 0.55) * s);
  c.lineTo(x + Math.cos(a + Math.PI / 2 - 0.55) * s, y + Math.sin(a + Math.PI / 2 - 0.55) * s);
  c.closePath(); c.fillStyle = col; c.fill();
}
let dangerList = [], tgts = [];
function drawOverlay() {
  const c = octx; c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, overC.width, overC.height);
  c.setTransform(k, 0, 0, k, 0, 0);
  const h = hdgRad(), rng = rangeNm();
  c.lineCap = "round";

  c.font = (nar ? 12 : 17) + "px sans-serif"; c.fillStyle = "#ff6464"; c.fillText("PORT", x0 + 6, top + 14); c.fillStyle = "#3cdc78"; c.fillText("STBD", x1 - (nar ? 36 : 52), top + 14);
}

// ======================================================================= anchor watch
async function awPoll() {
  try { const o = await (await fetch(API + "/anchor", { cache: "no-store" })).json(); aw.cfg = o.cfg || {}; aw.st = o.status || {}; aw.now = o.now || 0; } catch (e) {}
  const armed = !!aw.cfg.armed; document.body.classList.toggle("armed", armed);
  $("awbtn").textContent = armed ? "WATCH ON" : "WATCH OFF"; $("awbtn").classList.toggle("on", armed);
  $("awrad").textContent = Math.round(aw.cfg.radius_ft || 150) + " ft";
  const alive = aw.st && aw.st.t && (aw.now - aw.st.t) < 20, st = alive ? aw.st.state : "nowatcher", info = $("awinfo");
  if (!armed) { info.textContent = ""; }
  else if (!alive) { info.textContent = "NOT RUNNING. The anchor-watch service is not answering. Nothing is watching."; info.className = "bad"; }
  else if (st === "alarm") { info.textContent = "ALARM  " + Math.round(aw.st.dist_ft || 0) + " ft. The boat is outside the circle. Switch the watch off to stop it."; info.className = "bad"; }
  else if (st === "nogps" || st === "nogps_alarm") { info.textContent = "NO GPS. A watch with no GPS is not watching."; info.className = "amber"; }
  else { info.textContent = ""; }
  setTimeout(awPoll, 1500);
}
async function awSend(body) { try { await fetch(API + "/anchor", { method: "POST", headers: { "Content-Type": "application/json", "X-Radar-Web": "1" }, body: JSON.stringify(body) }); } catch (e) {} }
$("awbtn").onclick = () => awSend({ armed: !aw.cfg.armed });
$("aw-m").onclick = () => awSend({ radius_ft: Math.max(25, (aw.cfg.radius_ft || 150) - 25) });
$("aw-p").onclick = () => awSend({ radius_ft: Math.min(2000, (aw.cfg.radius_ft || 150) + 25) });

// ======================================================================= radar controls (through the pass-through)
async function put(cid, body) {
  if (!rc.id) { rc.err = "no radar found"; rc.errT = Date.now(); return; }
  try {
    const r = await fetch(API + "/radar/" + rc.id + "/controls/" + cid, { method: "PUT", headers: { "Content-Type": "application/json", "X-Radar-Web": "1" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error("bad");
    rc.vals[cid] = Object.assign({}, rc.vals[cid] || {}, body);
  } catch (e) { rc.err = "could not set " + cid; rc.errT = Date.now(); }
  refreshControls();
}
function powerClick(v) {
  if (v === 2) { if (Date.now() - txConfirm > 4000) { txConfirm = Date.now(); powerBtn(); refreshControls(); return; } txConfirm = 0; }
  put("power", { value: v });
}
const PWN = { 0: "OFF", 1: "STANDBY", 2: "TRANSMIT", 3: "PREPARING", 4: "FAULT" };
function powerBtn() {
  const b = $("btn-power"); b.className = "ctlonly";
  if (Date.now() - txConfirm <= 4000) { b.textContent = "TAP AGAIN: TRANSMIT"; b.classList.add("warn"); return; }
  if (!rc.ok) { b.textContent = "RADAR: NO LINK"; b.classList.add("warn"); return; }
  const pv = (rc.vals.power || {}).value; b.textContent = "POWER: " + (PWN[pv] || "?"); b.classList.add("p" + (pv === 2 ? 2 : pv === 1 ? 1 : 0));
}
$("btn-power").onclick = () => { if (Date.now() - txConfirm <= 4000) { powerClick(2); return; } $("ctl").classList.add("open"); };
$("btn-more").onclick = () => $("ctl").classList.toggle("open");
$("btn-north").onclick = () => { cfg.northup = !cfg.northup; saveCfg(); };
const drag = {};
function buildControls() {
  const caps = rc.caps || {}, root = $("ctl"); root.innerHTML = ""; rc.built = true;
  const el = (t, props, parent) => { const e = document.createElement(t); Object.assign(e, props || {}); (parent || root).appendChild(e); return e; };
  const h3 = el("h3"); h3.innerHTML = "RADAR <small id=\"ctlst\"></small>";
  const x = el("button", { textContent: "close", style: "float:right" }, h3); x.onclick = () => root.classList.remove("open");
  const pw = caps.power;
  if (pw) {
    const row = el("div", { id: "pwr" });
    for (const v of (pw.validValues || [0, 1, 2])) { const b = el("button", { textContent: String((pw.descriptions || {})[v] || v).toUpperCase(), className: "p" + v }, row); b.dataset.v = v; b.onclick = () => powerClick(v); }
  }
  for (const cid of ["gain", "colorGain", "sea", "rain"]) {
    const c = caps[cid]; if (!c) continue;
    const blk = el("div", { className: "blk" }), t = el("div", { className: "t" }, blk); el("span", { textContent: String(c.name || cid).toUpperCase() }, t);
    let kind = c.hasAuto ? "auto" : c.hasEnabled ? "enabled" : null, tog = null;
    if (kind) { tog = el("button", { textContent: kind === "auto" ? "AUTO" : "ON" }, t); tog.onclick = () => { const cur = (rc.vals[cid] || {})[kind]; put(cid, { [kind]: !cur }); }; }
    const sl = el("input", { type: "range", min: c.minValue || 0, max: c.maxValue || 100, step: c.stepValue || 1 }, blk);
    sl.oninput = () => { drag[cid] = true; };
    sl.onchange = () => { drag[cid] = false; const body = { value: +sl.value }; if (kind === "auto") body.auto = false; else if (kind === "enabled") body.enabled = true; put(cid, body); };
    sl.dataset.cid = cid; sl.dataset.kind = kind || ""; if (tog) tog.dataset.cid = cid;
  }
  for (const cid of ["mode", "interferenceRejection"]) {
    const c = caps[cid]; if (!c || c.dataType !== "enum" || c.isReadOnly) continue;
    const desc = c.descriptions || {}; let keys = Object.keys(desc).map(Number).sort((a, b) => a - b);
    if (c.validValues) keys = keys.filter(k => c.validValues.includes(k)); if (!keys.length) continue;
    const blk = el("div", { className: "blk" }), t = el("div", { className: "t" }, blk); el("span", { textContent: String(c.name || cid).toUpperCase() }, t);
    const sel = el("select", {}, t); sel.dataset.cid = cid;
    for (const kk of keys) el("option", { value: kk, textContent: String(desc[kk]) }, sel);
    sel.onchange = () => put(cid, { value: +sel.value });
  }
  const rg = caps.range;
  if (rg && rg.validValues) {
    el("div", { className: "blk" }).innerHTML = '<div class="t"><span>RANGE</span></div>';
    const grid = el("div", { id: "rangegrid" });
    for (const m of rg.validValues) { const b = el("button", { textContent: fmtRng(m / NM) }, grid); b.dataset.m = m; b.onclick = () => put("range", { value: m }); }
    const sel = $("rngsel"); sel.innerHTML = "";
    for (const m of rg.validValues) { const o = document.createElement("option"); o.value = m; o.textContent = fmtRng(m / NM); sel.appendChild(o); }
    sel.onchange = () => put("range", { value: +sel.value });
  }
  const dsp = el("div", { className: "blk" }); dsp.innerHTML = '<div class="t"><span>DISPLAY</span></div>';
  const trails = el("button", { textContent: cfg.trails ? "TRAILS ON" : "TRAILS OFF" }, dsp); trails.onclick = () => { cfg.trails = !cfg.trails; saveCfg(); trails.textContent = cfg.trails ? "TRAILS ON" : "TRAILS OFF"; };
  const aisb = el("button", { textContent: cfg.ais ? " AIS ON" : " AIS OFF" }, dsp); aisb.onclick = () => { cfg.ais = !cfg.ais; saveCfg(); aisb.textContent = cfg.ais ? " AIS ON" : " AIS OFF"; };
  const sg = el("div", { className: "blk" }); sg.innerHTML = '<div class="t"><span>SCREEN GAIN</span><small>brightness cut-off only, does not touch the radar</small></div>';
  const sgi = el("input", { type: "range", min: 2, max: 60, step: 1, value: cfg.gain }, sg); sgi.oninput = () => { cfg.gain = +sgi.value; saveCfg(); };
  el("a", { href: "http://" + HOST + ":6502/gui/viewer.html?id=" + rc.id, target: "_blank", textContent: "FULL MAYARA PANEL" });
}
function refreshControls() {
  if (!rc.built) return;
  const now = Date.now();
  const st = $("ctlst"); if (st) { st.textContent = now - rc.errT < 6000 ? rc.err : rc.ok ? rc.name : "no answer from radar control (mayara)"; st.style.color = now - rc.errT < 6000 ? "#ff5a52" : rc.ok ? "#4dff4d" : "#ffcc44"; }
  const pv = (rc.vals.power || {}).value, conf = now - txConfirm <= 4000;
  document.querySelectorAll("#pwr button").forEach(b => { const v = +b.dataset.v, on = pv === v; b.classList.toggle("on", on);
    b.textContent = (v === 2 && conf) ? "PRESS AGAIN" : String(((rc.caps.power || {}).descriptions || {})[v] || v).toUpperCase(); });
  document.querySelectorAll("#ctl input[type=range][data-cid]").forEach(sl => { const cid = sl.dataset.cid, val = rc.vals[cid] || {};
    if (!drag[cid] && val.value !== undefined && Math.abs(+sl.value - val.value) > 0.5) sl.value = val.value; });
  document.querySelectorAll("#ctl button[data-cid]").forEach(b => { const cid = b.dataset.cid, kind = rc.caps[cid].hasAuto ? "auto" : "enabled"; b.classList.toggle("on", !!(rc.vals[cid] || {})[kind]); });
  document.querySelectorAll("#ctl select[data-cid]").forEach(s => { const val = (rc.vals[s.dataset.cid] || {}).value; if (val !== undefined) s.value = val; });
  const rm = (rc.vals.range || {}).value;
  document.querySelectorAll("#rangegrid button").forEach(b => b.classList.toggle("sel", +b.dataset.m === rm));
  const rs = $("rngsel"); if (rm && document.activeElement !== rs) rs.value = rm;
}
async function rcInit() {
  try {
    const d = await (await fetch(API + "/radar")).json(), ids = Object.keys(d.radars || {});
    if (ids.length) {
      rc.id = rc.id && ids.includes(rc.id) ? rc.id : ids[0]; rc.name = d.radars[rc.id].name || rc.id;
      const full = await (await fetch(API + "/radar/" + rc.id + "/capabilities")).json();
      rc.caps = full.controls || {}; rc.nspokes = full.spokesPerRevolution || 250; setPalette(full.legend); buildControls(); connectSpokes();
      return;
    }
  } catch (e) {}
  setTimeout(rcInit, 3000);
}
async function rcPoll() {
  if (rc.id) { try { rc.vals = await (await fetch(API + "/radar/" + rc.id + "/controls", { cache: "no-store" })).json(); rc.ok = true; const rv = (rc.vals.range || {}).value; if (rv) radar.rangeM = rv; } catch (e) { rc.ok = false; } refreshControls(); }
  setTimeout(rcPoll, 2000);
}
async function swellPoll() { try { const o = await (await fetch(API + "/swell")).json(); swell = o && o.hs_ft !== undefined ? { frm: o.from_true_deg === undefined ? null : +o.from_true_deg, hs: +o.hs_ft, per: +(o.period_s || 0) } : null; } catch (e) {} setTimeout(swellPoll, 30000); }

// ======================================================================= go
function frame() { drawScope(); }
let lastF = 0;
function loop(t) { if (t - lastF >= 100) { lastF = t; frame(); } requestAnimationFrame(loop); }
let rt = 0;
setInterval(() => { updatePanel(); drawRose(); drawRudder(); }, 500);
navPoll(); aisPoll(); awPoll(); rcInit(); rcPoll(); swellPoll();
requestAnimationFrame(loop);
window.__radar = { nav, ais, rc, radar, aw, cfg, get R() { return R; } };
</script>
